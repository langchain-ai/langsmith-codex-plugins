name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@8e0f62e485438d455cdb9ea43f45f666aa6a8e68
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
