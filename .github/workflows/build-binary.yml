name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@22bb8158d3337e8d78c4142e06bba189477cc2ec
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
