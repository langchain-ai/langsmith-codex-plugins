name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@9d86935f573f859c343e4b50586c344f47cad2d2 # 9d86935
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
