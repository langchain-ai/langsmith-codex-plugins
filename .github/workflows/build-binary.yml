name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@bbee665375e2df6e89b88ae19a14df54fb705fcb # bbee665
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
