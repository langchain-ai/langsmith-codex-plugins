name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@d87f7383914986007793bd44be3737c8122cb99b # d87f738
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
