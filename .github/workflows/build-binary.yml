name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@d21ce5de46a419adc59107c1360f07f1e7362dc7 # d21ce5d
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
