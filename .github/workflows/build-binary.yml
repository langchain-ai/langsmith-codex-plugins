name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@51382c34f4c8133af7deacb3177e525ee88568b3 # 51382c3
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
