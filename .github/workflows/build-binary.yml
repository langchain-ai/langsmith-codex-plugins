name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@336ecc347acb0e7c2839ca065ea69862b43ceb66
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
