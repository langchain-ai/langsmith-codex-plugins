name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@994334de6c9aee85e49435a6dc688a8ecc27be5a # 994334d
    secrets: inherit
    with:
      bun-version: 1.4.4
      binary-directory: plugins/tracing/binary
