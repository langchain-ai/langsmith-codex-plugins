name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@5214a3010b2adb00c006a45fa9f2bd6921ada739
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
