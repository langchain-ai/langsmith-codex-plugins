name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@211193b9ee4f92d95539d344b64b5a4ac420a6a9 # 211193b
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
