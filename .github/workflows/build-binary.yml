name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugins-base/.github/workflows/build-binary.yml@46b9258f2e45a5cfd474e59febd70ca410de6ce6 # v0.7.1
    secrets: inherit
    with:
      bun-version: 1.4.4
      binary-directory: plugins/tracing/binary
