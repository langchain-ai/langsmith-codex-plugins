name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@e11aa5cf65fd51a491efbcf6b9ba702c6f03c467 # e11aa5c
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
