name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@a4717ea037918cb976ee30b25403ac82411d6454
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
