      pull-requests: write
    uses: langchain-ai/langsmith-plugins-base/.github/workflows/build-binary.yml@fd57fbac627bda95687f12c4b4a23db693341271 # fd57fba
    secrets: inherit
    with:
      bun-version: 1.4.4
      binary-directory: plugins/tracing/binary
