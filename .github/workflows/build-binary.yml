name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@ca202c1c95e2239a1ddebf88ad23a884151040cc # ca202c1
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
