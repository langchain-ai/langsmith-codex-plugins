name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@988aaf6a478d7a95cfe015c8bac3f1c9c16ec3c7 # 988aaf6
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
