name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@2d1f6c58fa4c647501e7499aea9225543e623ed3
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
