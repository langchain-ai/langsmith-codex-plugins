name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@63d73a41eb564a3361a0441b1f307bad4dc95fe6
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
