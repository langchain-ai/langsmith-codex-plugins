name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@c5fb35d3a1e062c65a5ab33338fcd7a322064530 # c5fb35d
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
