name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@26e0b421e283438e50d2d6fa103e34cc725eab25
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
