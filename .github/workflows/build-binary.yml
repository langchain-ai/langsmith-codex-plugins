name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@889a76286cc7ff143757acad24abd6f6b4d7775d # v0.6.2
    secrets: inherit
    with:
      bun-version: 1.4.4
      binary-directory: plugins/tracing/binary
