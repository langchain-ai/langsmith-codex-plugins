name: Build Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@c83aa312d98fde5521fee1d38f36731750a569d0
    secrets: inherit
    with:
      binary-directory: plugins/tracing/binary
