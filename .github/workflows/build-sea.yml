# Builds the tracing hook into a standalone binary so users do not need Node. See CONTRIBUTING.md.

name: Build Binary

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - .github/workflows/build-sea.yml
      - install.sh
      - macos-entitlements.plist
      - package.json
      - scripts/build.sea.ts
      - scripts/sign.sea.ts
      - plugins/tracing/hooks/hooks.sea.json
      - plugins/tracing/src/index.ts
      - plugins/tracing/src/install.ts
      - plugins/tracing/src/plugin-status.ts
      - plugins/tracing/src/sea-constants.ts
      - plugins/tracing/src/sea-models.ts
      - plugins/tracing/src/stand-down.ts
      - plugins/tracing/src/updater-download.ts
      - plugins/tracing/src/updater-install.ts
      - plugins/tracing/src/updater-releases.ts
      - plugins/tracing/src/updater-utils.ts
      - plugins/tracing/src/updater.ts
      - plugins/tracing/src/utils/runningCompiledBinary.ts
      - plugins/tracing/test/build-sea.test.ts
      - plugins/tracing/test/install-sea.test.ts
      - plugins/tracing/test/sea.test.ts
      - plugins/tracing/test/sign-sea.test.ts
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-sea:
    name: Build the Unsigned Binaries
    runs-on: macos-26
    outputs:
      publishing: ${{ steps.release-gate.outputs.publishing }}

    steps:
      - name: Decide Whether the Build Is Being Released
        id: release-gate
        env:
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: echo "publishing=${PUBLISHING}" >> "$GITHUB_OUTPUT"

      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          architecture: arm64
          cache: "pnpm"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Check the Version Matches the Tag
        if: ${{ steps.release-gate.outputs.publishing == 'true' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./plugins/tracing/.codex-plugin/plugin.json').version")
          if [ "$version" != "$TAG" ]; then
            echo "plugin.json version ${version} does not match tag ${TAG}" >&2
            exit 1
          fi
          echo "plugin.json version ${version} matches tag ${TAG}"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Unsigned Binaries
        run: pnpm run build:sea -- --arch=all

      - name: Test the Binary
        run: pnpm vitest run plugins/tracing/test/sea.test.ts plugins/tracing/test/install-sea.test.ts

      - name: Upload the arm64 Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-codex-tracing-darwin-arm64-unsigned
          path: plugins/tracing/bin/langsmith-codex-tracing
          if-no-files-found: error
          retention-days: 7

      - name: Upload the x64 Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-codex-tracing-darwin-x64-unsigned
          path: plugins/tracing/bin/darwin-x64/langsmith-codex-tracing
          if-no-files-found: error
          retention-days: 7

  run-x64-on-intel:
    name: Run the x64 Binary on Intel
    needs: build-sea
    runs-on: macos-26-intel

    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          architecture: x64
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the x64 Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langsmith-codex-tracing-darwin-x64-unsigned
          path: plugins/tracing/bin

      - name: Restore the Executable Bit
        run: chmod +x plugins/tracing/bin/langsmith-codex-tracing

      - name: Report the Version
        run: |
          arch
          file plugins/tracing/bin/langsmith-codex-tracing
          ./plugins/tracing/bin/langsmith-codex-tracing --version

      - name: Test the Binary
        run: pnpm vitest run plugins/tracing/test/sea.test.ts plugins/tracing/test/install-sea.test.ts

  sign-and-notarize:
    name: Sign and Notarize the Binary (${{ matrix.arch }})
    needs: build-sea
    if: ${{ needs.build-sea.outputs.publishing == 'true' }}
    runs-on: ${{ matrix.runner }}
    environment: macos-signing

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel

    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          architecture: ${{ matrix.arch }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the Unsigned Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langsmith-codex-tracing-darwin-${{ matrix.arch }}-unsigned
          path: plugins/tracing/bin

      - name: Restore the Executable Bit
        run: chmod +x plugins/tracing/bin/langsmith-codex-tracing

      - name: Sign and Notarize the Binary
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: pnpm run sign:sea

      - name: Test the Signed Binary
        run: pnpm vitest run plugins/tracing/test/sea.test.ts plugins/tracing/test/install-sea.test.ts

      - name: Upload the Signed Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-codex-tracing-darwin-${{ matrix.arch }}-signed
          path: plugins/tracing/bin/langsmith-codex-tracing
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the Binaries to the Release
    needs: [build-sea, sign-and-notarize]
    if: ${{ needs.build-sea.outputs.publishing == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download the Signed Binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: langsmith-codex-tracing-darwin-*-signed
          path: release

      - name: Attach the Binaries to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=()
          for arch in arm64 x64; do
            name="langsmith-codex-tracing-darwin-${arch}-${TAG}"
            mv "release/langsmith-codex-tracing-darwin-${arch}-signed/langsmith-codex-tracing" "release/${name}"
            (cd release && sha256sum "$name" > "${name}.sha256")
            assets+=("release/${name}" "release/${name}.sha256")
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            case "$TAG" in
              *-*) prerelease=true ;;
              *) prerelease=false ;;
            esac
            gh release create "$TAG" "${assets[@]}" \
              --draft \
              --verify-tag \
              --prerelease="$prerelease" \
              --generate-notes \
              --notes "These macOS arm64 and x64 binaries are signed and notarized. Download the one matching your Mac, then run \`chmod +x <binary>\` and \`./<binary> --install\`. Check it against its SHA-256 sidecar first if you want to. It does not update itself, so run \`--update\` when you want the next release."
          fi
