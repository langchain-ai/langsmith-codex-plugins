# Builds the tracing hook into a standalone binary so users do not need Node. See CONTRIBUTING.md.

name: Build Binary

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - .github/workflows/build-sea.yml
      - install.sh
      - macos-entitlements.plist
      - tsdown.sea.config.ts
      - sea-config.json
      - package.json
      - scripts/sign.sea.ts
      - plugins/tracing/hooks/hooks.sea.json
      - plugins/tracing/src/index.ts
      - plugins/tracing/src/install.ts
      - plugins/tracing/src/plugin-status.ts
      - plugins/tracing/src/sea-constants.ts
      - plugins/tracing/src/sea-models.ts
      - plugins/tracing/src/stand-down.ts
      - plugins/tracing/src/updater-download.ts
      - plugins/tracing/src/updater-install.ts
      - plugins/tracing/src/updater-releases.ts
      - plugins/tracing/src/updater-utils.ts
      - plugins/tracing/src/updater.ts
      - plugins/tracing/test/install-sea.test.ts
      - plugins/tracing/test/sea.test.ts
      - plugins/tracing/test/sign-sea.test.ts
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-sea:
    name: Build Unsigned Binary
    runs-on: macos-26
    outputs:
      publishing: ${{ steps.release-gate.outputs.publishing }}

    steps:
      - name: Decide Whether the Build Is Being Released
        id: release-gate
        env:
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: echo "publishing=${PUBLISHING}" >> "$GITHUB_OUTPUT"

      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # node --build-sea needs Node >= 25.5.
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          architecture: arm64
          cache: "pnpm"

      - name: Check the Version Matches the Tag
        if: ${{ steps.release-gate.outputs.publishing == 'true' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./plugins/tracing/.codex-plugin/plugin.json').version")
          if [ "$version" != "$TAG" ]; then
            echo "plugin.json version ${version} does not match tag ${TAG}" >&2
            exit 1
          fi
          echo "plugin.json version ${version} matches tag ${TAG}"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Unsigned Binary
        run: pnpm run build:sea

      - name: Test the Binary
        run: pnpm vitest run plugins/tracing/test/sea.test.ts plugins/tracing/test/install-sea.test.ts

      - name: Upload the Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-codex-tracing-darwin-arm64-unsigned
          path: plugins/tracing/bin/langsmith-codex-tracing
          if-no-files-found: error
          retention-days: 7

  sign-and-notarize:
    name: Sign and Notarize the Binary
    needs: build-sea
    if: ${{ needs.build-sea.outputs.publishing == 'true' }}
    runs-on: macos-26
    environment: macos-signing

    env:
      HAS_APPLE_CREDENTIALS: >-
        ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY != ''
        && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}

    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          architecture: arm64
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the Unsigned Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langsmith-codex-tracing-darwin-arm64-unsigned
          path: plugins/tracing/bin

      - name: Restore the Executable Bit
        run: chmod +x plugins/tracing/bin/langsmith-codex-tracing

      - name: Sign and Notarize the Binary
        if: ${{ env.HAS_APPLE_CREDENTIALS == 'true' }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: pnpm run sign:sea

      - name: Test the Signed Binary
        run: pnpm vitest run plugins/tracing/test/sea.test.ts plugins/tracing/test/install-sea.test.ts

      - name: Upload the Signed Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-codex-tracing-darwin-arm64-unsigned
          path: plugins/tracing/bin/langsmith-codex-tracing
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish the Binary to the Release
    needs: [build-sea, sign-and-notarize]
    if: ${{ needs.build-sea.outputs.publishing == 'true' }}
    # The publish job only moves the artifact, so it does not need a Mac.
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download the Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langsmith-codex-tracing-darwin-arm64-unsigned
          path: release

      - name: Attach the Binary to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          name="langsmith-codex-tracing-darwin-arm64-${TAG}-unsigned"
          asset="release/${name}"
          mv release/langsmith-codex-tracing "$asset"
          (cd release && sha256sum "$name" > "${name}.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$asset" "${asset}.sha256" --clobber
          else
            case "$TAG" in
              *-*) prerelease=true ;;
              *) prerelease=false ;;
            esac
            gh release create "$TAG" "$asset" "${asset}.sha256" \
              --draft \
              --verify-tag \
              --prerelease="$prerelease" \
              --generate-notes \
              --notes "This macOS arm64 binary is unsigned and not notarized. Download it, then run \`chmod +x $name\`, \`xattr -d com.apple.quarantine $name\` and \`./$name --install\`. Check it against its SHA-256 sidecar first if you want to. It does not update itself, so run \`--update\` when you want the next release."
          fi
